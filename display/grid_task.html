<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
        }
        .main{
            border: 5px solid greenyellow;
            display: grid;
            /* height: 700px; */
            grid-template-columns: 200px 200px 200px 200px  ;
           
            grid-template-rows: 150px 150px 150px 150px;
            
            gap: 10px 10px ;
        }
        .box{
            padding: 13px;
            border: 2px solid red ;
            /* background-color: aqua; */
        }

        #box-1{
            background-color: aqua;
            grid-column: 1/5;
        }
    </style>
</head>
<body>
    <div class="main">
        <div class="box" id="box-1">b1</div>
        <div class="box" id="box-2">b2</div>
        <div class="box" id="box-3">b3</div>
        <div class="box" id="box-4">b4</div>
        <div class="box" id="box-5">b5</div>
        <div class="box" id="box-6">b6</div>
        <div class="box" id="box-7">b7</div>
        <div class="box" id="box-8">b8</div>
        <div class="box" id="box-9">b9</div>
        <div class="box" id="box-10">b10</div>
        <div class="box" id="box-11">b11</div>
        <div class="box" id="box-12">b12</div>
        <div class="box" id="box-13">b13</div>
        <div class="box" id="box-14">b14</div>
        <div class="box" id="box-15">b15</div>
        <div class="box" id="box-16">b16</div>
    </div>
</body>
</html>
