<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
        }
        .main{
            border: 5px solid white;
            display: grid;
            height: 650px;
            grid-template-columns: 80px 300px 300px  ;
            /* grid-auto-flow: column   ; */
            grid-template-rows: 150px 150px 150px 150px;
            /* justify-items: start ; */
            gap: 10px 10px ;
        }
        .box{
            padding: 13px;
            border: 2px solid red ;
        }

        #box-1{
            background-color: aqua;
            grid-column: 1/4;
        }
        #box-2{
            background-color: aqua;
            /* width: 50px; */
            grid-row: 2/4;
        }

        #box-3{
            background-color: aqua;
            grid-column-start: 2;
            grid-column-end: 4;
        }

        #box-7{
            background-color: aqua;
            grid-column: 1/4;
        }
        #box-4{
            background-color: aqua;
        }
        #box-6{ 
            background-color: aqua;
            /* grid-column: 1/4; */
        }
    </style>
</head>
<body>
    <div class="main">
        <div class="box" id="box-1">b1</div>
        <div class="box" id="box-2">b2</div>
        <div class="box" id="box-3">b3</div>
        <div class="box" id="box-4">b4</div>
        <!-- <div class="box" id="box-5">b5</div> -->
        <div class="box" id="box-6">b6</div>
        <div class="box" id="box-7">b7</div>
        
    </div>
</body>
</html>
