<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
        }

        .main{
            border: 5px solid white;
            display: grid;
            grid-template-columns: 200px 200px 200px;
            gap: 5px 5px;
            /* grid-template-rows: 100px 100px 100px; */
            /* grid-auto-flow: column; */
        }

        .box{
            border: 1px solid white;
            padding: 20px;
        }

        #b1{
            background-color: navy;
            grid-row: 1/3;
            height: 300px;
        }
        #b2{
            background-color: yellow;
            height: 150px;
        }
        #b3{
            background-color: navy;
            height: 150px;
        }
        #b4{
            background-color: palevioletred;
            height: 100px;
        }
        #b5{
            background-color: aqua;
            grid-row: 2/4;
            grid-column: 3/4;
        }
        #b6{
            background-color: aqua;
            height: 100px;
        }
        #b7{
            background-color: navy;
        }
        #b9{
            background-color: yellow;
            height: 300px;
        }
        #b10{
            background-color: palevioletred;
            grid-column: -3/-1;
        }
    </style>
</head>
<body>
    <div class="main">
        <div class="box" id="b1">b1</div>
        <div class="box" id="b2">b2</div>
        <div class="box" id="b3">b3</div>
        <div class="box" id="b4">b4</div>
        <div class="box" id="b5">b5</div>
        <div class="box" id="b6">b6</div>
        <div class="box" id="b7">b7</div>
        <div class="box" id="b9">b9</div>
        <div class="box" id="b10">b10</div>
    </div>
</body>
</html>
