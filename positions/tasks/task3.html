<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .main{
            position: relative;
            left: 100px;
            width: 1000px;
            height: 600px;
            border: 1px solid black;
            background-color: rgba(173, 225, 230, 0.585);
            box-shadow: 10px 10px 30px 1px rgba(128, 128, 128, 0.515);
            border-radius: 10px;
        }

        .submain{
            width: 350px;
            height: 150px;
            border: 1px solid black;
            border-radius: 10px;
            box-shadow: 20px 20px 30px 3px rgba(128, 128, 128, 0.515);

        }
        #box1{
            position: relative;
            left: 100px;
            top: 50px;
            background-color: rgb(42, 186, 243);
        }

        #box2{
            position: relative;
            left: 250px;
            bottom: 20px;
            background-color: rgb(245, 116, 12);
        }

        #box3{
            position: relative;
            left: 400px;
            bottom:80px;
            background-color: rgb(15, 235, 162);
        }

        #box4{
            position: relative;
            left: 500px;
            bottom: 130px;
            background-color: rgb(235, 41, 148);
        }

        .box{
            position: relative;
            left: 30px;
            font-family:Arial, Helvetica, sans-serif;
        }

        .para{
            position: relative;
            left: 30px;
            font-family:Arial, Helvetica, sans-serif;
        }

        #is{
            font-family: Arial, Helvetica, sans-serif;
            font-size: 50px;
            font-style: italic;
            color: rgb(40, 179, 40);
            position: relative;
            left: 400px;
            top: 20px;
        }
    </style>
</head>
<body>
    <h1 id="is" > GeeksForGeeks</h1>
    <div class="main">
        <div class="submain" id="box1">
            <h1 class="box"> Block 1 </h1>
            <p class="para"> Content for Block 1 </p>
        </div>
        <div class="submain" id="box2">
            <h1 class="box"> Block 2 </h1>
            <p class="para"> Content for Block 2 </p>
        </div>
        <div class="submain" id="box3">
            <h1 class="box"> Block 3 </h1>
            <p class="para"> Content for Block 3 </p>
        </div>
        <div class="submain" id="box4">
            <h1 class="box"> Block 4 </h1>
            <p class="para"> Content for Block 4 </p>
        </div>
    </div>
</body>
</html>
