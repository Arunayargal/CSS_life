<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .main{
            width: 900px;
            height: 650px;
            border-style: solid;
        }

        .box{
            width: 400px;
            height: 40px;
            border-style: solid;
        }

        #box1{
            position: relative;
            left: 300px;
            top: 120px;
        }

        #box2{
            position: relative;
            left: 400px;
            top: 150px;
        }

        #box3{
            position: relative;
            left: 400px;
            top: 180px;
        }

        #box4{
            position: relative;
            left: 300px;
            top: 205px;
        }

        #box5{
            width: 100px;
            height: 100px;
            position: relative;
            top: 25px;
            left: 90px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-style: italic;
            font-family: cursive;
        }
    </style>
</head>
<body>
    <div class="main">
        <div class="box" id="box1"></div>
        <div class="box" id="box2"></div>
        <div class="box" id="box3"></div>
        <div class="box" id="box4"></div>
        <div class="box" id="box5"> CSS Selectors</div>
    </div>
</body>
</html>
