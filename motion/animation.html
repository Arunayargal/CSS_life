<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            /* background-color: ; */
            box-sizing: border-box;
        }
        html,body{
            height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container{
            width: 800px;
            height: 600px;
            border: 5px  double;
        }
        .child {
            width: 150px ;
            height: 150px;
            background-color: yellow;
            border: 2px solid;
            animation-name: aruna;
            animation-duration: 6s;
            /* border-radius: 50%; */
        }

        @keyframes aruna {
            from {
                transform: translate(0px, 0px );
            }
            to{
                transform: translate(700px, 0px);
            }
        }
        
    </style>
</head>
<body>
    <div class="container">
        <div class="child">  box   </div>
    </div>
</body>
</html>
