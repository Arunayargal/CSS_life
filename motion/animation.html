<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            /* background-color: ; */
            box-sizing: border-box;
        }
        html,body{
            height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container{
            width: 800px;
            height: 600px;
            border: 5px  double;
        }
        .child {
            width: 100px ;
            height: 100px;
            background-color: yellow;
            border: 2px solid;
            animation-name: aruna;
            animation-duration: 3s;
            border-radius: 50%;
            /* animation-delay: 2s; */
            /* animation-timing-function: ease-in-out; */
            animation-iteration-count: infinite;
            /* animation-play-state: running; */
            /* animation-d irection: alternate; */
        }

        @keyframes aruna {
            0% {
                transform: translate(0px, 0px) rotate(0deg);
            }
            25%{
                transform: translate(700px,0px) rotate(450deg);
            }
            50%{
                transform: translate(700px,500px) rotate(180deg);
            }
            75%{
                transform: translate(0px,500px) rotate(360deg);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="child">  box   </div>
    </div>
</body>
</html>
