<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>animation</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            /* background-color: ; */
            box-sizing: border-box;
        }
        html,body{
            height: 100vh;
            width: 100vw;
            display: flex;
            /* justify-content: center;
            align-items: center; */
        }
        .container{
            width: 100%;
            height: 100%;
            border: 5px  solid;
            display: flex;
            padding-left: 100px;
            padding-top: 50px;
            background-color: black;
        }
        .child {
            width: 300px ;
            height: 700px;
            border: 2px dashed white;
            margin-top: 20px;
            /* margin-left: 10px; */
            /* box-shadow: 1px 1px 50px  gainsboro; */
            /* background-color: white; */
            /* border-radius: 50px; */
        }

        #c1,#c3,#c5{
            border-top: none;
        }
        #c2,#c4{
            border-bottom: none;
        }
        .box{
            width: 100px ;
            height: 100px;
            border: 2px solid red;
            background-color: red;
            animation-name: aruna;
            animation-duration: 10s;
            animation-iteration-count: infinite;
            border-radius: 50%;
            box-shadow: 1px 2px 50px 5px  red;
        }
       
        @keyframes aruna {
            0% {
                transform: translate(-50px, 0px) ;
            }
            10%{
                transform: translate(-50px,650px) ;
            }
            15%{
                transform: translate(250px,650px) ;
            }
            25%{
                transform: translate(250px,-30px) ;
            }
            30%{
                transform: translate(550px,-30px) ;
            }
            40%{
                transform: translate(550px,650px) ;
            }
            50%{
                transform: translate(850px,650px) ;
            }
            60%{
                transform: translate(850px,-30px) ;
            }
            70%{
                transform: translate(1150px,-30px) ;
            }
            80%{
                transform: translate(1150px,650px) ;
            }
            90%{
                transform: translate(1450px,650px) ;
            }
            100%{
                transform: translate(1450px,-30px) ;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="child" id="c1"> <div class="box"></div></div>
        <div class="child" id="c2"></div>
        <div class="child" id="c3"></div>
        <div class="child" id="c4"></div>
        <div class="child" id="c5"></div>
    </div>
</body>
</html>
