<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            /* background-color: ; */
            box-sizing: border-box;
        }
        html,body{
            height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container{
            width: 100%;
            height: 100%;
            border: 5px  solid;
            display: flex;
            padding-left: 100px;
            padding-top: 100px;
        }
        .child {
            width: 300px ;
            height: 700px;
            border: 2px dashed black;
            margin-top: 20px;
            /* margin-left: 10px; */
        }

        #c1{
            border-top: none;
            
        }
        #c3{
            border-top: none;
        }
        #c5{
            border-top: none;
        }
        #c2{
            border-bottom: none;
        }
        #c4{
            border-bottom: none;
        }
        .box{
            width: 100px ;
            height: 100px;
            border: 2px solid black;
            background-color: orange;
            animation-name: aruna;
            animation-duration: 5s;
            animation-iteration-count: infinite;
            
        }
       
        @keyframes aruna {
            0% {
                transform: translate(0px, 0px) ;
            }
            10%{
                transform: translate(0px,650px) ;
            }
            15%{
                transform: translate(200px,650px) ;
            }
            25%{
                transform: translate(200px,0px) ;
            }
            30%{
                transform: translate(500px,0px) ;
            }
            40%{
                transform: translate(500px,650px) ;
            }
            50%{
                transform: translate(800px,650px) ;
            }
            60%{
                transform: translate(800px,0px) ;
            }
            70%{
                transform: translate(1100px,0px) ;
            }
            80%{
                transform: translate(1100px,650px) ;
            }
            90%{
                transform: translate(1400px,650px) ;
            }
            100%{
                transform: translate(1400px,0px) ;
            }
        }

        
    </style>
</head>
<body>
    <div class="container">
        <div class="child" id="c1"> <div class="box"></div></div>
        <div class="child" id="c2"></div>
        <div class="child" id="c3"></div>
        <div class="child" id="c4"></div>
        <div class="child" id="c5"></div>
    </div>
</body>
</html>
