<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            /* background-color: ; */
            box-sizing: border-box;
        }
        html,body{
            height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container{
            width: 800px;
            height: 600px;
            border: 5px  double;
        }
        .child {
            width: 150px ;
            height: 150px;
            background-color: yellow;
            border: 2px solid;
            transition-property: all;      /*transition-property: all ----> means it will apply the transition for all the properties of a box*/
            transition-duration: 6s;
            transition-timing-function: cubic-bezier(1, -0.47, 0, 1.86) ;
            /* transition-delay: 2s; */
        }
        .child:hover{
            transform: translate(650px);
            background-color: aqua;
            border-radius: 50%;
            /* display: flex;
            justify-content: center;
            align-items: center; */
        }
        /* img{
            width: 150px ;
            height: 150px;
            transition-property: all;
            transition-duration: 6s;
            transition-timing-function: cubic-bezier(1, -0.47, 0, 1.86) ;
        }
        img:hover{
            transform: translate(650px);
            border-radius: 50%;
        } */
    </style>
</head>
<body>
    <div class="container">
        <div class="child"> 
            <!-- <img src="https://img.magnific.com/free-photo/closeup-shot-beautiful-butterfly-with-interesting-textures-orange-petaled-flower_181624-7640.jpg?semt=ais_hybrid&w=740&q=80" alt=""> -->
        </div>
    </div>
</body>
</html>
