<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .main{
            width: 400px; 
            height: 300px;
            border: solid;
            border-radius: 5px;
            border-top-right-radius:  250px  ;
            border-bottom-left-radius:  250px ;
            border-right-color: aqua;
            border-top-color: aqua;
            border-bottom-color:  hotpink ;
            border-left-color: hotpink;
            border-right: solid 50px aqua;
            border-top: solid 5px aqua;
            border-left: solid 50px hotpink;
            border-bottom: solid 5px hotpink ;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .second{
            width: 400px;
            height: 200px;
            border-style: groove;
            border-width: 20px;
            border-left: groove 20px rgba(255, 105, 180, 0.768) ;
            border-top: groove 20px rgb(77, 253, 77);
            border-top-right-radius: 180px;
            border-bottom: groove 20px aqua;
            border-bottom-right-radius: 180px;
            border-top-left-radius: 20px;
            border-bottom-left-radius: 20px;
            border-right-color: rgba(172, 255, 47, 0.537); 
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .third{
            width: 300px;
            height: 200px;
            border-style: groove;
            border-bottom: dashed;
            border-bottom-width: 5px;
            border-bottom-color: rgb(50, 255, 47);
            border-top-left-radius: 150px;
            border-top-right-radius: 150px;
            border-left: groove 30px rgba(54, 234, 54, 0.835);
            border-right: groove 30px rgba(54, 234, 54, 0.835);
            border-top: groove 10px rgba(54, 234, 54, 0.835);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .last{
            width: 400px;
            height: 300px;
            border-style: double;
            border-width: 20px;
            border-color: hotpink;
            border-top-left-radius: 200px;
            border-top-right-radius: 200px;
            border-bottom-left-radius: 300px;
            border-bottom-right-radius: 300px;
            border-top: 10px;
            border-bottom:  1px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
    </style>
</head>
<body>
    <h1> 1. </h1>
    <h1 class="main" align="center" style="background-color: greenyellow;">Advanced leaf </h1> <br><br>
    <h1>2. </h1>
    <h1 class="second" align="center">Advanced Bullet </h1> <br><br>
    <h1>3. </h1>
    <h3 class="third"> Advanced Hemisphere </h3> <br><br>
    <h1>4. </h1>
    <h3 class="last"> Advanced Round Rectangle </h3>
</body>
</html>
